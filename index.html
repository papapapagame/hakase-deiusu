<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>はかせでぃうす</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <canvas id="game-canvas" width="960" height="540" aria-label="はかせでぃうす"></canvas>

    <div id="hud" class="hidden">
      <div class="hud-left">
        <div class="hud-lives" id="lives-row"></div>
        <div class="hud-score">
          <span class="hud-label">スコア</span>
          <span id="score-value">0</span>
        </div>
      </div>
      <div id="power-bar" class="power-bar" aria-label="装備">
        <div class="power-slot" data-p="speed">SPEED</div>
        <div class="power-slot" data-p="missile">MISSILE</div>
        <div class="power-slot" data-p="double">DOUBLE</div>
        <div class="power-slot" data-p="laser">LASER</div>
        <div class="power-slot" data-p="option">OPTION</div>
        <div class="power-slot" data-p="shield">SHIELD</div>
      </div>
      <div class="hud-right">
        <div class="hud-best">
          <span class="hud-label">ベスト</span>
          <span id="best-value">0</span>
        </div>
      </div>
    </div>

    <div id="stick-layer" class="hidden" aria-hidden="true">
      <div id="stick-base">
        <div id="stick-knob"></div>
      </div>
    </div>

    <div id="title-screen" class="overlay">
      <div class="panel title-panel">
        <p class="brand">はかせでぃうす</p>
        <p class="tagline">
          金色のティラノではかせが宇宙を駆ける‼<br>
          左スティックで移動、ショットは自動。<br>
          敵を倒すとパワーアップが落ちることがあるぞ！
        </p>
        <div class="howto">
          <p>SPEED / MISSILE / DOUBLE / LASER / OPTION / SHIELD</p>
        </div>
        <p class="best-line">ベスト <span id="title-best">0</span></p>
        <label class="sound-toggle">
          <span class="sound-toggle-label">効果音</span>
          <input id="toggle-sfx" type="checkbox" checked>
          <span class="switch" aria-hidden="true"></span>
        </label>
        <button id="btn-start" class="btn primary" type="button">スタート</button>
        <p class="hint">キーボードは矢印 / WASD　スマホは左スティック</p>
        <p class="version" id="app-version">Ver.1.00</p>
      </div>
    </div>

    <div id="gameover-screen" class="overlay hidden">
      <div class="panel result-panel">
        <p class="result-title" id="result-title">ゲームオーバー</p>
        <p class="result-score">スコア <span id="final-score">0</span></p>
        <p id="new-best" class="new-best hidden">ベスト更新！</p>
        <div class="result-actions">
          <button id="btn-retry" class="btn primary" type="button">もういちど</button>
          <button id="btn-title" class="btn secondary" type="button">タイトルへ</button>
        </div>
      </div>
    </div>
  </div>

  <div id="rotate-hint">
    <p>画面を横にして遊んでね</p>
  </div>

  <script src="game.js"></script>
</body>
</html>
